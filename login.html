<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Connect | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <script>
    (function () { try { var t = localStorage.getItem('cc-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <script src="js/data.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main class="login-wrap">
    <section class="card login-card">
      <div class="brand" style="padding:0 0 18px">
        <span class="brand-logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></span>
        <span class="brand-text"><small>Campus</small><strong>Connect</strong></span>
      </div>
      <h1 class="login-title">Welcome back</h1>
      <p class="muted" style="margin:6px 0 20px">Sign in to continue.</p>

      <form class="form-stack" id="loginForm" novalidate>
        <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <p class="form-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <div class="demo-box">
        <h2>Demo accounts (click a row to fill)</h2>
        <table class="table" id="demoTable">
          <thead><tr><th>Role</th><th>Username</th><th>Password</th></tr></thead>
          <tbody></tbody>
        </table>
        <button class="link-btn" id="resetData" type="button" style="margin-top:12px">Reset demo data</button>
      </div>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
