<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Connect | Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint to avoid a flash */
    (function () { try { var t = localStorage.getItem('cc-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <script src="js/data.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="notifications">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>

      <main class="page" id="page">
        <section class="greeting">
          <h1>Notifications</h1>
          <p>Alerts and campus broadcasts.</p>
        </section>

        <section class="card" data-roles="faculty placement" aria-labelledby="bc-title">
          <div class="card-head"><h2 class="card-title" id="bc-title">Send a broadcast</h2></div>
          <form class="form-grid" id="noteForm">
            <div class="field"><label for="nTitle">Title</label><input id="nTitle" required maxlength="80"></div>
            <div class="field"><label for="nType">Category</label>
              <select id="nType"><option value="academic">Academic</option><option value="placement">Placement</option><option value="club">Club</option><option value="admin">Admin</option></select></div>
            <div class="field" style="grid-column:1/-1"><label for="nBody">Message</label><textarea id="nBody" rows="2" maxlength="200" required></textarea></div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Send to everyone</button></div>
          </form>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">Inbox <span class="badge tone-orange" id="unreadCount"></span></h2>
            <button class="btn btn-ghost btn-sm" id="markAll">Mark all as read</button></div>
          <ul id="noteList"></ul>
        </section>
      </main>
    </div>

    <nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>
  </div>

  <script src="js/main.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
