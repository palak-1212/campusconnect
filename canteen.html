<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Connect | Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <script>
    /* Apply saved theme before first paint to avoid a flash */
    (function () { try { var t = localStorage.getItem('cc-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
  <script src="js/data.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="canteen">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>

      <main class="page" id="page">
        <section class="greeting">
          <h1>Smart Canteen</h1>
          <p>Order food, get a token and pay at the counter.</p>
        </section>

        <div class="two-col">
          <section>
            <div class="chips" id="catChips" aria-label="Menu categories"></div>
            <div class="menu-grid" id="menuGrid"></div>
          </section>
          <aside class="card cart" aria-label="Your cart">
            <div class="card-head"><h2 class="card-title">Your cart</h2></div>
            <ul id="cartList"></ul>
            <div class="cart-total"><span>Total</span><strong id="cartTotal">Rs. 0</strong></div>
            <button class="btn btn-primary" id="placeOrder" style="width:100%">Place order</button>
            <button class="btn btn-ghost" id="clearCart" style="width:100%;margin-top:8px">Clear cart</button>
          </aside>
        </div>

        <section class="card">
          <div class="card-head"><h2 class="card-title">My orders</h2><span class="muted" style="font-size:var(--fs-sm)">Status updates automatically</span></div>
          <ul id="orderList"></ul>
        </section>
      </main>
    </div>

    <nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>
  </div>

  <script src="js/main.js"></script>
  <script src="js/canteen.js"></script>
</body>
</html>
